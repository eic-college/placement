<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EICC | Review Placement Report</title>
<style>
:root{--ink:#111827;--muted:#4a5468;--brand:#060c2c;--brand-dark:#1d2a5c;--navy:#060c2c;--line:#dde2ec;--input:#a3acc2;--bg:#f4f6fa;--error:#b42336;--error-bg:#fff0f1;--ok-bg:#eef1f8;--focus:#2563eb}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{background:#fff;border-top:6px solid var(--navy)}
.top-inner{max-width:860px;margin:auto;padding:18px 20px;display:flex;align-items:center;justify-content:center;gap:22px}
.top img{width:92px;height:auto;flex:none}
.college{text-align:center;color:var(--navy)}
.college p{margin:2px 0 0;font-size:15px;color:#1f2940}
.college .college-name{margin:0 0 4px;font-size:26px;font-weight:800;line-height:1.2;color:var(--navy)}
.college a{color:inherit}
.page-bar{background:var(--navy);color:#fff;text-align:center;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:8px 12px}
main{max-width:860px;margin:0 auto;padding:26px 20px 48px}
h1{font-size:clamp(25px,4vw,33px);line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.lead{color:var(--muted);margin:0 0 20px}
.panel{border:1px solid var(--line);border-radius:16px;background:#fff;padding:22px;margin:0 0 16px;box-shadow:0 12px 40px rgba(6,12,44,.07)}
.panel h2{font-size:19px;margin:0 0 14px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.big{font-size:26px;color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#4a5468}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
th.num{text-align:right}
tr.off td{color:#6b7487}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#7a5a00;background:#fff7d6;border-radius:6px;padding:1px 6px;margin-left:4px}
.text{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.notice{border-radius:12px;padding:14px 16px;margin:0 0 16px}
.notice.warn{background:#fffbeb;border:2px solid #d97706}
.notice.error{background:var(--error-bg);border:1px solid #fac1c7;color:#921d30}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-size:19px;font-weight:700;margin:0 0 12px;padding:0}
.choice{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid var(--line);border-radius:10px;margin:0 0 9px;cursor:pointer}
.choice:has(input:checked){border-color:var(--brand);background:#eef1fa}
.choice input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
.issue{background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:16px;margin:8px 0 0}
label.lbl{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input.ctl,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--input);border-radius:9px;background:#fff}
textarea{min-height:110px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.field-error{color:var(--error);font-size:14px;font-weight:600;margin:6px 0 0}
[aria-invalid="true"]{border-color:var(--error)!important;box-shadow:0 0 0 2px #ffd9de}
.btn{width:100%;min-height:50px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-weight:750;font-size:16px;margin-top:18px;cursor:pointer}
.btn:hover{background:var(--brand-dark)}
.btn:disabled{opacity:.6;cursor:wait}
.done{text-align:center}
.done .mark{width:58px;height:58px;border-radius:50%;background:#e8ebf5;color:var(--brand-dark);display:grid;place-items:center;font-size:28px;margin:0 auto 12px}
footer{text-align:center;font-size:13px;color:#4a5468}
footer a{color:var(--brand)}
@media(max-width:600px){.top-inner{flex-direction:column;gap:8px;padding:14px}.top img{width:76px}.college .college-name{font-size:21px}.college p{font-size:14px}main{padding:18px 14px 40px}.panel{padding:16px}.facts{grid-template-columns:1fr}th:nth-child(2),td:nth-child(2){display:none}}
</style>
<script>
var EICC_API_URL = "https://script.google.com/macros/s/AKfycbyo6z8T6QMewbmDpTnDYKA7zNMfiUbucxkR-xtDmfTp-uqYz-SoHoL2GX8PvQXhRBMy/exec";
/* google.script.run for pages hosted outside Google: the same calls go to the Public
   Portal's doPost as plain JSON, without cookies, so the visitor's Google accounts
   never matter. EICC_API_URL is set by scripts/build-site.js. */
window.google = { script: { run: (function () {
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, fn) {
      if (fn === 'withSuccessHandler') return function (h) { return runner(h, fail); };
      if (fn === 'withFailureHandler') return function (h) { return runner(ok, h); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var failed = function (message) { if (fail) fail({ message: message }); };
        fetch(EICC_API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow' })
          .then(function (res) { return res.json(); })
          .then(function (reply) {
            if (reply && Object.prototype.hasOwnProperty.call(reply, 'error')) return failed(reply.error);
            if (ok) ok(reply ? reply.result : null);
          }, function () { failed('We could not reach EICC. Please check your internet connection and try again.'); });
      };
    } });
  }
  return runner();
})() } };
</script>
</head>

<script>
function eiccWireReview(token) {
  'use strict';
  var TOKEN = token;
  var $ = function (id) { return document.getElementById(id); };
  var form = $('review-form'), issue = $('issue'), disc = $('discrepancies');
  var FIELDS = ['reviewed', 'hoursAccurate', 'activitiesAccurate', 'notes', 'correctedTotal', 'signature'];
  disc.addEventListener('change', function () { issue.hidden = !disc.checked; if (disc.checked) $('notes').focus(); });
  function show(errors) {
    var first = null;
    FIELDS.forEach(function (f) {
      var el = $(f), err = $(f + '-error'); if (!el || !err) return;
      var e = errors.filter(function (x) { return x.field === f; })[0];
      err.textContent = e ? e.message : ''; err.hidden = !e;
      el.setAttribute('aria-invalid', e ? 'true' : 'false');
      if (e && !first) first = el;
    });
    if (first) first.focus();
  }
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var btn = $('submit'), formError = $('form-error');
    formError.hidden = true;
    var act = $('activitiesAccurate');
    var payload = { token: TOKEN, reviewed: $('reviewed').checked, hoursAccurate: $('hoursAccurate').checked,
      activitiesAccurate: act ? act.checked : true, discrepancies: disc.checked,
      verifiedTotalHours: $('correctedTotal').value, discrepancyNotes: $('notes').value, supervisorSignature: $('signature').value };
    btn.disabled = true; btn.textContent = 'Submitting…';
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false; btn.textContent = 'Submit Review';
      if (!r.ok) return show(r.errors || []);
      $('done-text').textContent = r.discrepancies
        ? 'EICC has received your comments. The student will be asked to correct the log, and you will receive the corrected version to review.'
        : 'EICC has received your signed verification. No further action is needed.';
      $('review-content').hidden = true; $('done').hidden = false; $('done').focus(); window.scrollTo(0, 0);
    }).withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Submit Review';
      formError.textContent = (err && err.message) || 'Your review could not be submitted. Please try again.'; formError.hidden = false;
    }).submitSupervisorReview(payload);
  });
}

/* Supervisor review page outside Google: loads the review by token, renders the same
   markup as apps/portal/Review.html, then wires the form (eiccWireReview, built from
   Review.html's own script). Every value is escaped before it is placed in the page. */
(function () {
  'use strict';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var main = document.getElementById('main');
  var token = new URLSearchParams(location.search).get('token') || '';
  function footer(email) {
    return '<footer>Questions? Contact EICC Placements' + (email ? ' at <a href="mailto:' + esc(email) + '">' + esc(email) + '</a>' : '') + '.</footer>';
  }
  function fail(message, email) {
    main.innerHTML = '<h1>Review Placement Report</h1><div class="notice error" role="alert"><strong>We couldn\'t open this review.</strong><br>' +
      esc(message) + '</div>' + footer(email);
  }
  function render(v, email) {
    var days = v.days.map(function (d) {
      return '<tr class="' + (d.worked ? '' : 'off') + '">' +
        '<th scope="row" style="text-transform:none;letter-spacing:0;font-size:15px;color:inherit">' + esc(d.day) + '</th>' +
        '<td>' + esc(d.date) + '</td>' +
        '<td>' + (d.worked ? esc(d.start) + ' – ' + esc(d.end) : 'Not worked') + '</td>' +
        '<td class="num">' + (d.worked ? esc(d.hours) : '—') + '</td></tr>';
    }).join('');
    main.innerHTML =
      '<div id="review-content">' +
      '<h1>Review Placement Report</h1>' +
      '<p class="lead">Please check this student\'s hours and activities for the week, then confirm them or tell us what needs to change.</p>' +
      (v.previousComments ? '<div class="notice warn"><strong>This is a corrected log.</strong> Your earlier comments were:<div class="text" style="margin-top:8px">' + esc(v.previousComments) + '</div></div>' : '') +
      '<section class="panel" aria-labelledby="sum-h"><h2 id="sum-h">Student Profile</h2><dl class="facts">' +
      '<div><dt>Name</dt><dd>' + esc(v.studentName) + '</dd></div>' +
      '<div><dt>Hours Reported</dt><dd class="big">' + esc(v.total) + ' hours</dd></div>' +
      '<div><dt>Placement Location</dt><dd>' + esc(v.placementSite) + '</dd></div>' +
      '<div><dt>Week</dt><dd>Week ' + esc(v.weekNumber) + ': ' + esc(v.week) + '</dd></div></dl></section>' +
      '<section class="panel" aria-labelledby="log-h"><h2 id="log-h">Hours Reported</h2><table>' +
      '<thead><tr><th scope="col">Day</th><th scope="col">Date</th><th scope="col">Shift</th><th scope="col" class="num">Hours</th></tr></thead>' +
      '<tbody>' + days + '</tbody></table></section>' +
      (v.weeklySummary ? '<section class="panel" aria-labelledby="ws-h"><h2 id="ws-h">Weekly Summary of Activities</h2><div class="text">' + esc(v.weeklySummary) + '</div></section>' : '') +
      (v.zeroReason ? '<section class="panel" aria-labelledby="zr-h"><h2 id="zr-h">Reason for No Placement Hours</h2><div class="text">' + esc(v.zeroReason) + '</div></section>' : '') +
      '<section class="panel" aria-labelledby="decl-h"><h2 id="decl-h">Student Declaration</h2><p style="margin:0">' + esc(v.declaration) +
      '<br><span class="hint">Signed: ' + esc(v.signature) + '</span></p></section>' +
      '<section class="panel" aria-labelledby="confirm-h"><h2 id="confirm-h" class="vh">Check All That Apply</h2><form id="review-form" novalidate>' +
      '<fieldset><legend>Check All That Apply</legend>' +
      '<label class="choice"><input type="checkbox" id="reviewed" aria-describedby="reviewed-error"><span>I have reviewed the student\'s weekly placement log.</span></label>' +
      '<p class="field-error" id="reviewed-error" hidden></p>' +
      '<label class="choice"><input type="checkbox" id="hoursAccurate" aria-describedby="hoursAccurate-error"><span>The hours recorded accurately reflect the student\'s placement attendance.</span></label>' +
      '<p class="field-error" id="hoursAccurate-error" hidden></p>' +
      (v.total > 0 ? '<label class="choice"><input type="checkbox" id="activitiesAccurate" aria-describedby="activitiesAccurate-error"><span>The activities recorded are consistent with the student\'s placement activities.</span></label>' +
        '<p class="field-error" id="activitiesAccurate-error" hidden></p>' : '') +
      '<label class="choice"><input type="checkbox" id="discrepancies" aria-controls="issue"><span>Something needs to be corrected (the student will be asked to fix it).</span></label>' +
      '</fieldset>' +
      '<div class="issue" id="issue" hidden>' +
      '<label class="lbl" for="notes">What Needs to Be Corrected?</label>' +
      '<textarea id="notes" maxlength="3000" aria-describedby="notes-hint notes-error"></textarea>' +
      '<p class="hint" id="notes-hint">The student will see these comments.</p><p class="field-error" id="notes-error" hidden></p>' +
      '<label class="lbl" for="correctedTotal">Hours You Can Verify</label>' +
      '<input class="ctl" id="correctedTotal" type="number" inputmode="decimal" min="0" max="168" step="0.01" value="' + esc(v.total) + '" aria-describedby="correctedTotal-error" style="max-width:200px">' +
      '<p class="field-error" id="correctedTotal-error" hidden></p></div>' +
      '<label class="lbl" for="signature">Type Your Full Name to Sign</label>' +
      '<input class="ctl" id="signature" autocomplete="name" maxlength="160" aria-describedby="signature-hint signature-error">' +
      '<p class="hint" id="signature-hint">Signature</p><p class="field-error" id="signature-error" hidden></p>' +
      '<p class="field-error" id="form-error" role="alert" hidden></p>' +
      '<button class="btn" id="submit" type="submit">Submit Review</button></form></section></div>' +
      '<section class="panel done" id="done" hidden tabindex="-1" aria-labelledby="done-h"><div class="mark" aria-hidden="true">✓</div>' +
      '<h2 id="done-h">Thank you. Your review has been submitted.</h2><p id="done-text"></p><p class="hint">You can close this page.</p></section>' +
      footer(email);
    eiccWireReview(token);
  }
  google.script.run.withSuccessHandler(function (r) {
    if (r.error) return fail(r.error, r.collegeEmail);
    render(r.view, r.collegeEmail);
  }).withFailureHandler(function (err) {
    fail((err && err.message) || 'This review could not be loaded. Please try again.');
  }).getSupervisorReview(token);
})();
