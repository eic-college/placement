<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EICC Placement Dashboard</title>
<style>
:root{--ink:#111827;--muted:#4a5468;--navy:#060c2c;--line:#dde2ec;--bg:#f4f6fa;--card:#fff;--focus:#2563eb;
  --ok:#166534;--ok-bg:#e8f6ee;--wait:#8a4b00;--wait-bg:#fff4dc;--bad:#b42336;--bad-bg:#fff0f1;--none:#4a5468;--none-bg:#eef1f6}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:#1d4ed8}
.top{background:#fff;border-top:6px solid var(--navy);border-bottom:1px solid var(--line)}
.top-inner{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:54px;height:auto}
.top .title{font-weight:800;font-size:20px;color:var(--navy);line-height:1.2}
.top .title small{display:block;font-weight:500;font-size:13px;color:var(--muted)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(24px,4vw,30px);margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 18px;box-shadow:0 10px 30px rgba(6,12,44,.06)}
.panel-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .grow{flex:1;min-width:220px}
.hint{color:var(--muted);font-size:14px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 18px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:#1d2a5c}
.btn.light{background:#fff;color:var(--navy)}
.btn.light:hover{background:#eef1f8}
.btn.small{min-height:36px;padding:5px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.6;cursor:wait}
.linkbtn{background:none;border:0;padding:0;color:#1d4ed8;text-decoration:underline;cursor:pointer;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0 0 18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-align:left;cursor:pointer;border-left:8px solid var(--line)}
.tile:hover{box-shadow:0 6px 20px rgba(6,12,44,.10)}
.tile .n{font-size:34px;font-weight:800;line-height:1.1}
.tile .l{font-weight:700}
.tile .s{font-size:14px;color:var(--muted)}
.tile.wait{border-left-color:#f0a020}.tile.bad{border-left-color:var(--bad)}.tile.ok{border-left-color:#22a05a}.tile.info{border-left-color:var(--navy)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.waiting{background:var(--wait-bg);color:var(--wait)}
.chip.sentback{background:var(--bad-bg);color:var(--bad)}.chip.none{background:var(--none-bg);color:var(--none)}
table{width:100%;border-collapse:collapse}
th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#f7f9fd}
.name{font-weight:700;color:var(--navy)}
.sub{font-size:14px;color:var(--muted)}
.search{width:100%;max-width:340px;min-height:44px;padding:8px 12px;border:2px solid #a3acc2;border-radius:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff;display:flex;flex-direction:column;gap:6px}
.card .actions{margin-top:auto;padding-top:8px}
.empty{padding:18px;text-align:center;color:var(--muted);background:#f8fafc;border-radius:12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px;margin:0}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-weight:700;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{border-left:3px solid var(--line);padding:0 0 14px 16px;position:relative}
.timeline li:before{content:"";position:absolute;left:-8px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--navy)}
.timeline li.first:before{background:#9aa3b8}
.notice{border-radius:12px;padding:12px 14px;margin:0 0 14px}
.notice.error{background:var(--bad-bg);color:#7f1d1d;border:1px solid #f3c2c8}
.notice.info{background:#eef4ff;border:1px solid #c9d8f5}
.signin{max-width:460px;margin:40px auto;text-align:center}
.signin .panel{padding:32px 26px}
#gsi-btn{display:flex;justify-content:center;margin:20px 0 8px;min-height:44px}
.back{display:inline-block;margin:0 0 12px;font-weight:700}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:60;max-width:90vw}
.backdrop{position:fixed;inset:0;background:rgba(6,12,44,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:22px;border-top:6px solid var(--navy)}
.modal.danger{border-top-color:var(--bad)}
.modal h2{margin:0 0 10px}
.modal .buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.modal .buttons .btn{flex:1 1 180px}
label.f{display:block;font-weight:700;margin:12px 0 4px}
input.f,textarea.f{width:100%;min-height:44px;padding:8px 12px;border:2px solid #a3acc2;border-radius:10px}
textarea.f{min-height:80px}
.err{color:var(--bad);font-weight:600;margin:10px 0 0}
.loading{color:var(--muted);padding:30px 0;text-align:center}
select.batch{min-height:38px;border:2px solid #a3acc2;border-radius:8px;padding:4px 8px;background:#fff}
@media (max-width:720px){
  table.stack thead{display:none}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 4px}
  table.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 10px;text-align:right}
  table.stack td:before{content:attr(data-l);font-weight:700;color:var(--muted);text-align:left}
  table.stack td.num{text-align:right}
}
</style>

  <div class="title">EICC Placement Dashboard<small>Excellence Imperial Career College</small></div>
  <div class="right" id="who" hidden>
    <label for="batch" class="vh" hidden>Batch</label>
    <select id="batch" class="batch" aria-label="Batch" hidden></select>
    <span id="who-name"></span>
    <button type="button" class="btn light small" id="sign-out">Sign out</button>
  </div>
</div></header>
<main id="main">
  <section class="signin" id="signin-view" hidden>
    <div class="panel">
      <h1>Welcome</h1>
      <p class="lead">Sign in with your Google account to see students' placement hours.</p>
      <div id="signin-msg"></div>
      <div id="gsi-btn"></div>
      <p class="hint">Only EICC staff who have been given access can sign in.</p>
    </div>
  </section>
  <div id="app" hidden></div>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  };
  var STORE = 'eiccStaffToken';
  var state = { token: null, me: null, batch: '', overview: null };
  var STATE_LABEL = { ok: 'All signed', waiting: 'Waiting for preceptor', sentback: 'Needs to fix a week', none: 'No reports yet' };

  /* ---------- sign-in ---------- */
  function tokenExpiry(t) {
    try { return JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).exp * 1000; } catch (e) { return 0; }
  }
  function saveToken(t) { state.token = t; try { sessionStorage.setItem(STORE, t); } catch (e) {} }
  function clearToken() { state.token = null; try { sessionStorage.removeItem(STORE); } catch (e) {} }
  function showSignIn(message, isError) {
    clearToken();
    $('app').hidden = true; $('who').hidden = true; $('signin-view').hidden = false;
    $('signin-msg').innerHTML = message ? '<div class="notice ' + (isError ? 'error' : 'info') + '">' + esc(message) + '</div>' : '';
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.prompt();
  }
  window.eiccGisReady = function () {
    google.accounts.id.initialize({ client_id: EICC_STAFF_CLIENT_ID, callback: function (r) { saveToken(r.credential); start(); },
      auto_select: true, cancel_on_tap_outside: false });
    google.accounts.id.renderButton($('gsi-btn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
    if (!state.token) google.accounts.id.prompt();
  };
  $('sign-out').addEventListener('click', function () {
    if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    showSignIn('You have signed out.');
  });

  /* ---------- server ---------- */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return fetch(EICC_STAFF_API, { method: 'POST', credentials: 'omit', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, idToken: state.token }) })
      .then(function (r) { return r.json(); }, function () { throw new Error('Could not reach the server. Please check your internet connection and try again.'); })
      .then(function (out) {
        if (out.code === 'SIGNIN') { showSignIn('For your security, please sign in again.'); throw { quiet: true }; }
        if (out.code === 'NOT_STAFF') { showSignIn(out.error, true); throw { quiet: true }; }
        if (out.error) throw new Error(out.error);
        return out.result;
      });
  }
  function failed(err) {
    if (err && err.quiet) return;
    $('app').innerHTML = '<div class="notice error"><strong>Something went wrong.</strong><br>' + esc(err && err.message || err) +
      '</div><button class="btn" type="button" id="retry">Try again</button>';
    $('retry').onclick = route;
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.hidden = true; }, 5000);
  }

  /* ---------- start ---------- */
  function start() {
    $('signin-view').hidden = true; $('app').hidden = false;
    $('app').innerHTML = '<p class="loading">Loading…</p>';
    call('hello').then(function (me) {
      state.me = me;
      $('who').hidden = false; $('who-name').textContent = me.name;
      var sel = $('batch');
      sel.innerHTML = me.batches.map(function (b) { return '<option>' + esc(b) + '</option>'; }).join('');
      sel.hidden = me.batches.length < 2;
      state.batch = state.batch || me.batches[0] || '';
      sel.value = state.batch;
      route();
    }).catch(failed);
  }
  $('batch').addEventListener('change', function () { state.batch = $('batch').value; state.overview = null; location.hash = ''; route(); });
  window.addEventListener('hashchange', function () { if (state.me) route(); });
  function route() {
    var m = /^#student=(.+)$/.exec(location.hash);
    if (m) return showStudent(decodeURIComponent(m[1]));
    showOverview();
  }

  /* ---------- overview ---------- */
  function showOverview(fresh) {
    if (state.overview && !fresh) return renderOverview(state.overview);
    $('app').innerHTML = '<p class="loading">Loading…</p>';
    call('overview', state.batch).then(function (o) { state.overview = o; renderOverview(o); }).catch(failed);
  }
  function tile(cls, n, label, sub, target) {
    return '<button type="button" class="tile ' + cls + '" data-go="' + target + '"><div class="n">' + esc(n) + '</div><div class="l">' + esc(label) +
      '</div><div class="s">' + esc(sub) + '</div></button>';
  }
  function renderOverview(o) {
    var t = o.totals;
    var html = '<h1>' + esc(o.batch) + '</h1><p class="lead">Updated ' + esc(o.updated) +
      ' · <button type="button" class="linkbtn" id="refresh">Refresh</button></p>' +
      '<div class="tiles">' +
      tile(t.reportsWaiting ? 'wait' : 'ok', t.reportsWaiting, 'Reports waiting for preceptors', t.preceptorsWaiting + ' preceptor' + (t.preceptorsWaiting === 1 ? '' : 's') + ' to sign', 'waiting-sec') +
      tile(t.sentBack ? 'bad' : 'ok', t.sentBack, 'Weeks sent back to students', 'The student must fix and resend', 'students-sec') +
      tile(t.signInProblems ? 'wait' : 'ok', t.signInProblems, 'Students with sign-in trouble', 'In the last 7 days', 'signin-sec') +
      tile('info', t.hoursSigned, 'Hours signed', t.students + ' students in this batch', 'students-sec') + '</div>';

    html += '<section class="panel" id="students-sec"><div class="panel-head"><div class="grow"><h2>Students</h2>' +
      '<p class="hint">Click a student to see each week, signed PDFs and their placement history.</p></div>' +
      '<button type="button" class="btn" id="add-student">+ Add a student</button></div>' +
      '<input class="search" id="search" type="search" placeholder="Search by name, placement or preceptor" aria-label="Search students">' +
      '<table class="stack" style="margin-top:12px"><thead><tr><th>Student</th><th>Placement</th><th class="num">Hours signed</th><th class="num">Waiting</th><th>Status</th></tr></thead><tbody id="student-rows">' +
      o.students.map(function (s) {
        return '<tr class="click" tabindex="0" data-student="' + esc(s.name) + '" data-search="' + esc((s.name + ' ' + s.site + ' ' + s.preceptor).toLowerCase()) + '">' +
          '<td data-l="Student"><span class="name">' + esc(s.name) + '</span><div class="sub">' + esc(s.email) + '</div></td>' +
          '<td data-l="Placement">' + esc(s.site) + '<div class="sub">Preceptor: ' + esc(s.preceptor) + '</div></td>' +
          '<td data-l="Hours signed" class="num"><strong>' + esc(s.hoursSigned) + '</strong><div class="sub">' + s.weeksSigned + ' week' + (s.weeksSigned === 1 ? '' : 's') + '</div></td>' +
          '<td data-l="Waiting" class="num">' + (s.weeksWaiting ? esc(s.hoursWaiting) + '<div class="sub">' + s.weeksWaiting + ' week' + (s.weeksWaiting === 1 ? '' : 's') + '</div>' : '—') + '</td>' +
          '<td data-l="Status"><span class="chip ' + s.state + '">' + esc(STATE_LABEL[s.state]) + '</span>' + (s.weeksSentBack ? '<div class="sub">' + s.weeksSentBack + ' sent back</div>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' + (o.students.length ? '' : '<p class="empty">No students yet. Click "Add a student".</p>') + '</section>';

    html += '<section class="panel" id="waiting-sec"><div class="panel-head"><div class="grow"><h2>Waiting for preceptors</h2>' +
      '<p class="hint">These preceptors have reports to sign. A reminder emails them all their waiting reports, each with its own button.</p></div>' +
      (o.waiting.length ? '<button type="button" class="btn" id="remind-all">Send reminder to all</button>' : '') + '</div>' +
      (o.waiting.length ? '<div class="cards">' + o.waiting.map(function (w) {
        return '<div class="card"><div class="name">' + esc(w.preceptor) + '</div><div class="sub">' + esc(w.email) + '</div>' +
          '<div><strong>' + w.reports + ' report' + (w.reports === 1 ? '' : 's') + '</strong> · ' + esc(w.students.join(', ')) + '</div>' +
          '<div class="sub">Last emailed: ' + esc(w.lastEmailed || 'not yet') + '</div>' +
          '<div class="actions"><button type="button" class="btn light small" data-remind="' + esc(w.email) + '" data-name="' + esc(w.preceptor) + '" data-count="' + w.reports + '">Send reminder</button></div></div>';
      }).join('') + '</div>' : '<p class="empty">Nothing is waiting. Every submitted report has been signed or sent back.</p>') + '</section>';

    html += '<section class="panel" id="signin-sec"><h2>Sign-in trouble (last 7 days)</h2>' +
      '<p class="hint" style="margin-bottom:10px">These students typed a name or email that does not match the student list. If the student list is wrong, open the student and fix it; otherwise tell the student exactly what to type.</p>' +
      (o.signIns.length ? '<table class="stack"><thead><tr><th>When</th><th>Name typed</th><th>Email typed</th><th>Problem</th></tr></thead><tbody>' +
        o.signIns.map(function (p) {
          return '<tr><td data-l="When">' + esc(p.time) + '</td><td data-l="Name typed">' + esc(p.name) + '</td><td data-l="Email typed">' + esc(p.email) + '</td><td data-l="Problem">' + esc(p.problem) + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="empty">No sign-in trouble this week.</p>') + '</section>';

    html += '<section class="panel"><h2>Student link</h2><p class="hint">Students open this link to submit their weekly hours.</p>' +
      '<p style="overflow-wrap:anywhere"><a href="' + esc(o.studentLink) + '" target="_blank" rel="noopener">' + esc(o.studentLink) + '</a></p>' +
      '<button type="button" class="btn light small" id="copy-link">Copy student link</button></section>';
    $('app').innerHTML = html;

    $('refresh').onclick = function () { showOverview(true); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-go]'), function (b) {
      b.onclick = function () { $(b.getAttribute('data-go')).scrollIntoView({ behavior: 'smooth' }); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-student]'), function (tr) {
      var open = function () { location.hash = 'student=' + encodeURIComponent(tr.getAttribute('data-student')); };
      tr.onclick = open; tr.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
    });
    $('search').oninput = function () {
      var q = $('search').value.trim().toLowerCase();
      Array.prototype.forEach.call(document.querySelectorAll('#student-rows tr'), function (tr) { tr.hidden = q && tr.getAttribute('data-search').indexOf(q) < 0; });
    };
    $('add-student').onclick = addStudent;
    if ($('remind-all')) $('remind-all').onclick = function () { remind('', 'all ' + o.waiting.length + ' preceptors', t.reportsWaiting); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-remind]'), function (b) {
      b.onclick = function () { remind(b.getAttribute('data-remind'), b.getAttribute('data-name'), Number(b.getAttribute('data-count'))); };
    });
    $('copy-link').onclick = function () {
      var done = function () { toast('Student link copied.'); };
      if (navigator.clipboard) navigator.clipboard.writeText(o.studentLink).then(done, function () { window.prompt('Copy this link:', o.studentLink); });
      else window.prompt('Copy this link:', o.studentLink);
    };
  }

  /* ---------- modal ---------- */
  function modal(opts) {
    var back = document.createElement('div'); back.className = 'backdrop';
    back.innerHTML = '<div class="modal' + (opts.danger ? ' danger' : '') + '" role="dialog" aria-modal="true" aria-labelledby="m-h">' +
      '<h2 id="m-h">' + esc(opts.title) + '</h2><form id="m-form" novalidate>' + opts.body + '<p class="err" id="m-err" role="alert" hidden></p>' +
      '<div class="buttons"><button type="button" class="btn light" id="m-cancel">Cancel</button>' +
      '<button type="submit" class="btn' + (opts.danger ? ' danger' : '') + '" id="m-ok">' + esc(opts.ok) + '</button></div></form></div>';
    document.body.appendChild(back);
    var close = function () { back.remove(); document.removeEventListener('keydown', onKey); };
    var onKey = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    back.querySelector('#m-cancel').onclick = close;
    back.querySelector('#m-form').onsubmit = function (e) {
      e.preventDefault();
      var ok = back.querySelector('#m-ok'), err = back.querySelector('#m-err');
      ok.disabled = true; ok.textContent = 'Working…'; err.hidden = true;
      Promise.resolve().then(opts.onOk).then(close, function (x) {
        ok.disabled = false; ok.textContent = opts.ok;
        if (x && x.quiet) return close();
        err.textContent = (x && x.message) || String(x); err.hidden = false;
      });
    };
    var first = back.querySelector('input,textarea') || back.querySelector('#m-ok');
    first.focus();
    return back;
  }
  function field(id, label, value, type, hint) {
    return '<label class="f" for="' + id + '">' + esc(label) + '</label>' +
      (type === 'area' ? '<textarea class="f" id="' + id + '">' + esc(value) + '</textarea>'
        : '<input class="f" id="' + id + '" type="' + (type || 'text') + '" value="' + esc(value) + '" autocomplete="off">') +
      (hint ? '<p class="hint">' + esc(hint) + '</p>' : '');
  }
  var val = function (id) { return document.getElementById(id).value; };

  function remind(email, who, count) {
    modal({ title: 'Send a reminder?', ok: 'Yes, send reminder',
      body: '<p>This emails <strong>' + esc(who) + '</strong> a reminder with a button for each of the <strong>' + esc(count) +
        '</strong> waiting report' + (count === 1 ? '' : 's') + '.</p><p class="hint">Anyone already emailed in the last 12 hours is skipped.</p>',
      onOk: function () {
        return call('sendReminders', state.batch, email).then(function (r) {
          toast('Reminder sent to ' + r.sent.map(function (x) { return x.preceptor; }).join(', ') + '.' +
            (r.skipped.length ? ' Skipped (emailed recently): ' + r.skipped.map(function (x) { return x.preceptor; }).join(', ') + '.' : ''));
          showOverview(true);
        });
      } });
  }
  function addStudent() {
    modal({ title: 'Add a student', ok: 'Add student',
      body: '<p class="hint">The student signs in with exactly this name and email, so please check the spelling.</p>' +
        field('a-name', 'Student full name', '') + field('a-email', 'Student email', '', 'email') + field('a-id', 'Student ID', '') +
        field('a-site', 'Placement / facility', '') + field('a-pname', 'Preceptor name', '') + field('a-pemail', 'Preceptor email', '', 'email'),
      onOk: function () {
        return call('addStudent', state.batch, { name: val('a-name'), email: val('a-email'), studentId: val('a-id'), site: val('a-site'),
          preceptorName: val('a-pname'), preceptorEmail: val('a-pemail') }).then(function (o) {
          state.overview = o; location.hash = ''; renderOverview(o); toast('Student added.');
        });
      } });
  }

  /* ---------- student ---------- */
  function showStudent(name) {
    $('app').innerHTML = '<p class="loading">Loading…</p>';
    call('student', state.batch, name).then(renderStudent).catch(failed);
  }
  function renderStudent(s) {
    var html = '<a class="back" href="#">← All students</a><h1>' + esc(s.name) + '</h1>' +
      '<section class="panel"><div class="panel-head"><div class="grow"><h2>Details</h2></div>' +
      '<button type="button" class="btn light" id="change">Change placement</button></div><dl class="facts">' +
      '<div><dt>Email</dt><dd>' + esc(s.email) + '</dd></div><div><dt>Student ID</dt><dd>' + esc(s.id) + '</dd></div>' +
      '<div><dt>Placement</dt><dd>' + esc(s.site) + '</dd></div>' +
      '<div><dt>Preceptor</dt><dd>' + esc(s.preceptor) + '<div class="sub">' + esc(s.preceptorEmail) + '</div></dd></div></dl></section>';
    html += '<section class="panel"><h2>Weekly reports</h2>' + (s.weeks.length ?
      '<table class="stack"><thead><tr><th>Week</th><th>Dates</th><th class="num">Hours</th><th>Status</th><th>Preceptor comments</th><th></th></tr></thead><tbody>' +
      s.weeks.map(function (w) {
        return '<tr><td data-l="Week"><strong>Week ' + esc(w.week) + '</strong></td><td data-l="Dates">' + esc(w.dates) + '<div class="sub">' + esc(w.site) + '</div></td>' +
          '<td data-l="Hours" class="num">' + esc(w.hours) + (w.signedHours !== '' && w.signedHours !== w.hours ? '<div class="sub">signed ' + esc(w.signedHours) + '</div>' : '') + '</td>' +
          '<td data-l="Status"><span class="chip ' + w.state + '">' + esc(w.status) + '</span><div class="sub">' + esc(w.signedOn ? 'Signed ' + w.signedOn + ' by ' + w.preceptor : w.preceptor) + '</div></td>' +
          '<td data-l="Comments">' + (w.comments ? esc(w.comments) : '<span class="sub">—</span>') + '</td>' +
          '<td data-l="PDF">' + (w.hasPdf ? '<button type="button" class="btn light small" data-pdf="' + esc(w.recordId) + '">View PDF</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="empty">No weekly reports yet.</p>') + '</section>';
    html += '<section class="panel"><h2>Placement history</h2><p class="hint" style="margin-bottom:12px">Every facility and preceptor this student has had, oldest first.</p>' +
      (s.history.length ? '<ul class="timeline">' + s.history.map(function (h, i) {
        return '<li class="' + (i === 0 ? 'first' : '') + '"><strong>' + esc(h.site) + '</strong><div>Preceptor: ' + esc(h.preceptor) + ' <span class="sub">(' + esc(h.preceptorEmail) + ')</span></div>' +
          '<div class="sub">' + esc(h.change) + ' · ' + esc(h.when) + (h.note ? ' · ' + esc(h.note) : '') + '</div></li>';
      }).join('') + '</ul>' : '<p class="empty">No history recorded yet.</p>') + '</section>';
    if (s.notes) html += '<section class="panel"><h2>Notes</h2><div style="white-space:pre-wrap">' + esc(s.notes) + '</div></section>';
    $('app').innerHTML = html;
    window.scrollTo(0, 0);
    $('change').onclick = function () { changePlacement(s); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-pdf]'), function (b) { b.onclick = function () { openPdf(b); }; });
  }
  function changePlacement(s) {
    modal({ title: 'Change placement for ' + s.name, ok: 'Save new placement',
      body: '<p class="hint">Use this when the student moves to a new facility or gets a new preceptor. Weeks already submitted stay with their old preceptor, and the old placement is kept in the history.</p>' +
        field('c-site', 'New placement / facility', s.site) + field('c-pname', 'New preceptor name', s.preceptor) +
        field('c-pemail', 'New preceptor email', s.preceptorEmail, 'email') + field('c-note', 'Reason (optional)', '', 'area', 'For example: community placement starts Nov 9.'),
      onOk: function () {
        return call('changePlacement', state.batch, s.name, { site: val('c-site'), preceptorName: val('c-pname'), preceptorEmail: val('c-pemail'), note: val('c-note') })
          .then(function (updated) { state.overview = null; renderStudent(updated); toast('Placement saved. New weeks will go to ' + updated.preceptor + '.'); });
      } });
  }
  function openPdf(btn) {
    var win = window.open('', '_blank');
    if (win) win.document.write('<p style="font:16px system-ui;padding:20px">Opening the PDF…</p>');
    btn.disabled = true; btn.textContent = 'Opening…';
    call('pdf', state.batch, btn.getAttribute('data-pdf')).then(function (p) {
      var bytes = atob(p.base64), arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      if (win && !win.closed) win.location.href = url;
      else { var a = document.createElement('a'); a.href = url; a.download = p.name || 'placement.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
    }).catch(function (e) { if (win) win.close(); if (!e || !e.quiet) toast((e && e.message) || 'Could not open the PDF.'); })
      .then(function () { btn.disabled = false; btn.textContent = 'View PDF'; });
  }

  /* ---------- boot ---------- */
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved && tokenExpiry(saved) > Date.now() + 60000) { state.token = saved; start(); }
  else showSignIn('');
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="eiccGisReady()"></script>
</body>
