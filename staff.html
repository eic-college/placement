<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>EICC Placements</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --text:#0f172a;--text-2:#475569;--text-3:#94a3b8;--line:#e5e7eb;--line-2:#eef0f3;--bg:#f7f8fa;--panel:#fff;
  --brand:#0b1640;--brand-2:#1e2a5a;--brand-soft:#eef1fb;--focus:#3b5bdb;
  --green:#15803d;--green-dot:#22c55e;--amber:#b45309;--amber-dot:#f59e0b;--red:#b91c1c;--red-dot:#ef4444;--grey-dot:#cbd5e1;
  --radius:10px;--shadow:0 1px 2px rgba(15,23,42,.04),0 1px 1px rgba(15,23,42,.03)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}

/* layout */
.shell{display:flex;min-height:100%}
.side{width:248px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand img{width:34px;height:34px;object-fit:contain}
.brand b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:var(--text-2)}
.nav{padding:6px 10px;flex:1;overflow:auto}
.nav .label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--text-2);font-weight:500}
.nav a:hover{background:var(--bg);color:var(--text)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav svg{width:16px;height:16px;flex:none}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.me .who{min-width:0;flex:1}
.me .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{display:block;font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;min-width:0}
.topbar{display:none}
.page{max-width:1080px;margin:0 auto;padding:28px 32px 64px}

/* page header */
.crumbs{font-size:13px;color:var(--text-2);margin:0 0 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--text-2)}
.crumbs a:hover{color:var(--text);text-decoration:underline}
.crumbs .sep{color:var(--text-3)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 20px}
h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.meta{color:var(--text-2);margin:4px 0 0}
.head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.sec{background:#fff;color:var(--text);border-color:var(--line)}
.btn.sec:hover{background:var(--bg)}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.6;cursor:progress}
.btn svg{width:15px;height:15px}
.link{background:none;border:0;padding:0;color:var(--text-2);cursor:pointer;font-weight:500;text-decoration:underline;text-underline-offset:2px}
.link:hover{color:var(--text)}
.link.red{color:var(--red)}
.input{width:100%;height:38px;padding:0 12px;border:1px solid #d6dae1;border-radius:8px;background:#fff}
textarea.input{height:auto;min-height:84px;padding:9px 12px;resize:vertical}
.input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px rgba(59,91,219,.15)}
.search{position:relative;max-width:300px;flex:1}
.search svg{position:absolute;left:10px;top:11px;width:16px;height:16px;color:var(--text-3)}
.search .input{padding-left:34px}

/* surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:0 0 20px}
.stat{padding:16px 18px;border-left:1px solid var(--line-2)}
.stat:first-child{border-left:0}
.stat .k{font-size:12px;color:var(--text-2);font-weight:500}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat .v.amber{color:var(--amber)}.stat .v.red{color:var(--red)}
.stat .s{font-size:12px;color:var(--text-3)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;margin-bottom:-1px;color:var(--text-2);font-weight:500;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--brand);font-weight:600}
.count{font-size:12px;background:var(--line-2);color:var(--text-2);border-radius:999px;padding:0 7px;font-weight:600}
.tab.on .count{background:var(--brand-soft);color:var(--brand)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 12px}
.note{color:var(--text-2);margin:0 0 12px;max-width:720px}

/* tables */
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font-size:12px;font-weight:600;color:var(--text-2);text-align:left;padding:10px 14px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap}
.table th:first-child{border-top-left-radius:var(--radius)}.table th:last-child{border-top-right-radius:var(--radius)}
.table td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table .r{text-align:right}
.table tr.row{cursor:pointer}
.table tr.row:hover td{background:#fafbfc}
.strong{font-weight:600;color:var(--text)}
.muted{color:var(--text-2);font-size:13px}
.faint{color:var(--text-3)}
.status{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;font-weight:500}
.status:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grey-dot)}
.status.ok:before{background:var(--green-dot)}.status.waiting:before{background:var(--amber-dot)}.status.sentback:before{background:var(--red-dot)}
.empty{padding:36px 16px;text-align:center;color:var(--text-2)}
.empty b{display:block;color:var(--text);margin-bottom:2px}

/* batches */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.batch{padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;text-align:left;width:100%}
.batch:hover{border-color:#cfd5df}
.batch .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.batch .name{font-size:16px;font-weight:700;letter-spacing:-.01em}
.pill{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:#ecfdf3;color:var(--green)}
.pill.grey{background:var(--line-2);color:var(--text-2)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini .v{font-size:18px;font-weight:700}
.mini .k{font-size:12px;color:var(--text-2)}
.batch .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);padding-top:12px;color:var(--text-2);font-size:13px}

/* student */
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.section-title{font-size:14px;font-weight:600;margin:0;padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.dl{margin:0;padding:6px 16px 14px}
.dl div{padding:9px 0;border-bottom:1px solid var(--line-2)}
.dl div:last-child{border-bottom:0}
.dl dt{font-size:12px;color:var(--text-2)}
.dl dd{margin:2px 0 0;font-weight:500;overflow-wrap:anywhere}
.tl{list-style:none;margin:0;padding:14px 16px 4px}
.tl li{position:relative;padding:0 0 16px 20px}
.tl li:before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--text-3)}
.tl li:after{content:"";position:absolute;left:7px;top:19px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl li.now:before{border-color:var(--brand);background:var(--brand)}
.tl .when{font-size:12px;color:var(--text-3)}
.notes{padding:12px 16px 16px;white-space:pre-wrap;color:var(--text-2);font-size:13px}
.banner{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:10px 14px;margin:0 0 16px;color:var(--text-2)}
.banner b{color:var(--text)}
.alert{border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:13px}
.alert.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert.info{background:var(--brand-soft);color:var(--brand);border:1px solid #dbe2f7}

/* sign in */
.signin{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.signin .card{width:100%;max-width:400px;padding:32px 28px;text-align:center}
.signin img{width:56px;margin-bottom:14px}
.signin h1{font-size:20px}
.signin p{color:var(--text-2);margin:6px 0 0}
#gsi-btn{display:flex;justify-content:center;margin:22px 0 14px;min-height:44px}
.signin .fine{font-size:12px;color:var(--text-3)}

/* overlays */
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:#fff;padding:11px 16px;border-radius:8px;font-weight:500;box-shadow:0 10px 30px rgba(15,23,42,.25);z-index:60;max-width:min(420px,calc(100vw - 40px))}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;max-width:480px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(15,23,42,.3)}
.modal .mh{padding:18px 20px 4px}
.modal h2{font-size:17px;font-weight:700;margin:0}
.modal .mb{padding:8px 20px 4px;color:var(--text-2)}
.modal .mb p{margin:8px 0}
.modal .mb strong{color:var(--text)}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:16px 20px;border-top:1px solid var(--line-2);margin-top:12px}
.field{margin:12px 0 0}
.field label{display:block;font-weight:600;color:var(--text);margin:0 0 5px;font-size:13px}
.field .help{font-size:12px;color:var(--text-3);margin-top:4px}
.err{color:var(--red);font-weight:500;margin:10px 0 0}
.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:40px 16px}
.spinner{width:72px;height:72px;border-radius:50%;border:7px solid #d5dcf0;border-top-color:var(--brand);animation:spin .8s linear infinite}
.loading .lt{font-size:18px;font-weight:600;color:var(--text)}
.loading .ls{color:var(--text-2);max-width:360px}
.loading .slow{color:var(--amber);font-weight:500}
.btn .spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .8s linear infinite}
.btn.sec .spin{border-color:var(--line);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner,.btn .spin{animation-duration:2.4s}}

@media (max-width:900px){
  .side{display:none}
  .topbar{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:5}
  .topbar img{width:28px}
  .topbar b{flex:1;font-size:14px}
  .page{padding:20px 16px 48px}
  .split{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line-2)}
}
@media (max-width:640px){
  .table.stack thead{display:none}
  .table.stack,.table.stack tbody{display:block}
  .table.stack tr{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;border-bottom:1px solid var(--line-2);padding:12px 14px}
  .table.stack tr:last-child{border-bottom:0}
  .table.stack td{display:block;border:0;padding:0;text-align:left;min-width:0;overflow-wrap:anywhere}
  .table.stack td:first-child{grid-column:1/-1}
  .table.stack td:before{content:attr(data-l);display:block;color:var(--text-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .table.stack td[data-l=""]:before{display:none}
  .table.stack td[data-l=""]{grid-column:1/-1}
  .table.stack td:first-child:before{display:none}
  .head .actions{width:100%}
  .toolbar .muted{display:none}
  .search{max-width:none}
}
</style>

<script>

  /* ---------- modal ---------- */
  function modal(opts) {
    var back = document.createElement('div'); back.className = 'backdrop';
    back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-h"><form id="m-form" novalidate>' +
      '<div class="mh"><h2 id="m-h">' + esc(opts.title) + '</h2></div><div class="mb">' + opts.body + '<p class="err" id="m-err" role="alert" hidden></p></div>' +
      '<div class="mf"><button type="button" class="btn sec" id="m-cancel">Cancel</button>' +
      '<button type="submit" class="btn' + (opts.danger ? ' danger' : '') + '" id="m-ok">' + esc(opts.ok) + '</button></div></form></div>';
    document.body.appendChild(back);
    var close = function () { back.remove(); document.removeEventListener('keydown', onKey); };
    var onKey = function (e) { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('mousedown', function (e) { if (e.target === back) close(); });
    back.querySelector('#m-cancel').onclick = close;
    back.querySelector('#m-form').onsubmit = function (e) {
      e.preventDefault();
      var ok = back.querySelector('#m-ok'), err = back.querySelector('#m-err');
      ok.disabled = true; ok.innerHTML = '<span class="spin" aria-hidden="true"></span>Working, please wait…'; err.hidden = true;
      Promise.resolve().then(opts.onOk).then(close, function (x) {
        ok.disabled = false; ok.textContent = opts.ok;
        if (x && x.quiet) return close();
        err.textContent = (x && x.message) || String(x); err.hidden = false;
      });
    };
    (back.querySelector('input,textarea') || back.querySelector('#m-ok')).focus();
    return back;
  }

      '<div class="card"><div class="section-title">Placement history</div>' + (s.history.length ? '<ul class="tl">' + s.history.slice().reverse().map(function (h, i) {
        return '<li class="' + (i === 0 ? 'now' : '') + '"><div class="strong">' + esc(h.site) + '</div><div class="muted">' + esc(h.preceptor) + ' · ' + esc(h.preceptorEmail) + '</div>' +
          '<div class="when">' + esc(i === 0 ? 'Current · ' : '') + esc(h.change) + ', ' + esc(h.when) + (h.note ? ' · ' + esc(h.note) : '') + '</div></li>';
      }).join('') + '</ul>' : '<div class="empty">No history recorded yet.</div>') + '</div>' +
      (s.notes ? '<div class="card"><div class="section-title">Notes</div><div class="notes">' + esc(s.notes) + '</div></div>' : '') + '</div></div>';
    $('app').innerHTML = html;
    $('change').onclick = function () { changePlacement(s); };
    all('[data-pdf]').forEach(function (b) { b.onclick = function () { openPdf(b); }; });
  }
  function changePlacement(s) {
    modal({ title: 'Change placement', ok: 'Save placement',
      body: '<p>Use this when <strong>' + esc(s.name) + '</strong> moves to a new facility or gets a new preceptor. Weeks already submitted stay with their old preceptor, and the old placement stays in the history.</p>' +
        field('c-site', 'Placement / facility', s.site) + field('c-pname', 'Preceptor name', s.preceptor) +
        field('c-pemail', 'Preceptor email', s.preceptorEmail, 'email') + field('c-note', 'Reason (optional)', '', 'area', 'For example: community placement starts Nov 9.'),
      onOk: function () {
        return call('changePlacement', state.batch, s.name, { site: val('c-site'), preceptorName: val('c-pname'), preceptorEmail: val('c-pemail'), note: val('c-note') })
          .then(function (updated) { state.overview = null; renderStudent(updated); toast('Placement saved. New weeks will go to ' + updated.preceptor + '.'); });
      } });
  }
  function openPdf(btn) {
    var win = window.open('', '_blank');
    if (win) win.document.write('<p style="font:14px system-ui;padding:20px;color:#475569">Opening the PDF…</p>');
    btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Opening…';
    call('pdf', state.batch, btn.getAttribute('data-pdf')).then(function (p) {
      var bytes = atob(p.base64), arr = new Uint8Array(bytes.length);
      for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
      if (win && !win.closed) win.location.href = url;
      else { var a = document.createElement('a'); a.href = url; a.download = p.name || 'placement.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
    }).catch(function (e) { if (win) win.close(); if (!e || !e.quiet) toast((e && e.message) || 'Could not open the PDF.'); })
      .then(function () { btn.disabled = false; btn.textContent = 'View PDF'; });
  }

  /* ---------- boot ---------- */
  var saved = null;
  try { saved = sessionStorage.getItem(STORE); } catch (e) {}
  if (saved && tokenExpiry(saved) > Date.now() + 60000) { state.token = saved; start(); }
  else showSignIn('');
})();
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="eiccGisReady()"></script>
</body>
